server:
  #这里填你的服务器地址以及配置，多个地址请复制粘贴增加，以下为示例
  #- url: "example.com" 服务器地址
  #  port: 25565 服务器端口，默认为25565
  #  version: "auto" 服务器版本，推荐 auto；也可手动填写 1.xx.x/xx.x/1.xx
  - url: ""
    port: 25565
    version: "auto"

connect:
  #这里填你的与外部的连接设置，以下为示例
  #- timeout: 10 ws连接超时时间，单位为秒，默认为10秒
  #  retry: 3 ws连接重试次数，默认为3次
  #  host: "localhost" ws的主机地址，默认为localhost
  #  port: xxxxx ws连接的端口
  #  token: "change-me" ws认证令牌，必须配置
  #  admin_players: ["player1"] 可通过 MC 私聊执行所有指令的玩家名列表（管理员）
  #  user_players: ["player2"] 可通过 MC 私聊执行部分安全指令的玩家名列表（普通用户）
  #  guest_players: ["player3"] 可选显式访客列表；未命中 admin/user 的玩家默认同样视为 guest
  #  以上列表请填写 MC 玩家名（不是 QQ 号），支持大小写无关匹配
  #  示例：admin_players: ["Mutsumi"]
  #  whisper_command_prefix: "#" MC 私聊指令前缀，如 #mc status
  #  enable_ops_commands: false 是否启用 #ops restart/update 运维指令，默认关闭；启用前请配置 PM2/systemd/Docker 自动重启
  #  git_mirror_from: "https://github.com/" git pull 镜像重写的来源前缀，默认 GitHub
  #  git_mirror_to: "https://ghproxy.com/https://github.com/" git pull 镜像重写的目标前缀，设置后 #ops update 会临时启用
  timeout: 10
  retry: 3
  host: "localhost"
  port: xxxxx
  token: "change-me"
  admin_players: []
  user_players: []
  guest_players: []
  whisper_command_prefix: "#"
  enable_ops_commands: false
  git_mirror_from: "https://github.com/"
  git_mirror_to: ""
